4pPJwf8eMKsfELcf-97\&quot; edge=\&quot;1\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;Array as=\&quot;points\&quot;&gt;\n              &lt;mxPoint x=\&quot;70\&quot; y=\&quot;147\&quot; /&gt;\n              &lt;mxPoint x=\&quot;70\&quot; y=\&quot;147\&quot; /&gt;\n            &lt;/Array&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;JQ_74pPJwf8eMKsfELcf-110\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;exitX=1;exitY=0.25;exitDx=0;exitDy=0;\&quot; parent=\&quot;77e6c97f196da883-2\&quot; source=\&quot;77e6c97f196da883-8\&quot; target=\&quot;JQ_74pPJwf8eMKsfELcf-109\&quot; edge=\&quot;1\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;Array as=\&quot;points\&quot;&gt;\n              &lt;mxPoint x=\&quot;130\&quot; y=\&quot;60\&quot; /&gt;\n            &lt;/Array&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;77e6c97f196da883-8\&quot; value=\&quot;&amp;lt;font style=&amp;quot;font-size: 10px;&amp;quot;&amp;gt;1986年刘代兵与冯某新婚。&amp;lt;/font&amp;gt;&amp;lt;div&amp;gt;&amp;lt;font style=&amp;quot;font-size: 10px;&amp;quot;&amp;gt;1988年儿子刘振发出生，但刘振发出生后好几年都不会喊人（&amp;lt;font color=&amp;quot;#ff0000&amp;quot;&amp;gt;孕妇在孕期受害的后遗症&amp;lt;/font&amp;gt;）。&amp;lt;/font&amp;gt;&amp;lt;/div&amp;gt;\&quot; style=\&quot;rounded=1;whiteSpace=wrap;html=1;shadow=0;labelBackgroundColor=none;strokeWidth=1;fontFamily=Verdana;fontSize=8;align=left;\&quot; parent=\&quot;77e6c97f196da883-2\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;10\&quot; y=\&quot;30\&quot; width=\&quot;130\&quot; height=\&quot;95\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;JQ_74pPJwf8eMKsfELcf-100\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;\&quot; parent=\&quot;77e6c97f196da883-2\&quot; source=\&quot;JQ_74pPJwf8eMKsfELcf-97\&quot; target=\&quot;JQ_74pPJwf8eMKsfELcf-99\&quot; edge=\&quot;1\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;JQ_74pPJwf8eMKsfELcf-97\&quot; value=\&quot;1993年，家庭中自新婚起的所有礼金钱被刘代兵拿去在竺某家小卖铺里天天&amp;lt;font color=&amp;quot;#ff0000&amp;quot;&amp;gt;输钱，经常玩到半夜&amp;lt;/font&amp;gt;，牌桌涉家庭（竺田）（竺何）（何陈）（陈田）。\&quot; style=\&quot;whiteSpace=wrap;html=1;fontSize=10;fontFamily=Verdana;align=left;rounded=1;shadow=0;labelBackgroundColor=none;strokeWidth=3;\&quot; parent=\&quot;77e6c97f196da883-2\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;10\&quot; y=\&quot;180\&quot; width=\&quot;120\&quot; height=\&quot;85\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;JQ_74pPJwf8eMKsfELcf-102\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;\&quot; parent=\&quot;77e6c97f196da883-2\&quot; source=\&quot;JQ_74pPJwf8eMKsfELcf-99\&quot; target=\&quot;JQ_74pPJwf8eMKsfELcf-101\&quot; edge=\&quot;1\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;JQ_74pPJwf8eMKsfELcf-119\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;\&quot; parent=\&quot;77e6c97f196da883-2\&quot; source=\&quot;JQ_74pPJwf8eMKsfELcf-99\&quot; target=\&quot;JQ_74pPJwf8eMKsfELcf-118\&quot; edge=\&quot;1\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;Array as=\&quot;points\&quot;&gt;\n              &lt;mxPoint x=\&quot;140\&quot; y=\&quot;357\&quot; /&gt;\n              &lt;mxPoint x=\&quot;140\&quot; y=\&quot;357\&quot; /&gt;\n            &lt;/Array&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;JQ_74pPJwf8eMKsfELcf-99\&quot; value=\&quot;1993~1998年间，刘代兵将&amp;lt;font color=&amp;quot;#ff0000&amp;quot;&amp;gt;家中的金首饰、部队的飞机模型礼品都甩到邻居李光汉（姓李的）门前的坡那里&amp;lt;/font&amp;gt;（无论是吵架还是什么借口）。\&quot; style=\&quot;whiteSpace=wrap;html=1;fontSize=10;fontFamily=Verdana;align=left;rounded=1;shadow=0;labelBackgroundColor=none;strokeWidth=3;\&quot; parent=\&quot;77e6c97f196da883-2\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;10\&quot; y=\&quot;320\&quot; width=\&quot;120\&quot; height=\&quot;85\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;JQ_74pPJwf8eMKsfELcf-101\&quot; value=\&quot;1998年，因长江洪水，租车搬家具粮食逃难，刘家梨园的梨子&amp;lt;font color=&amp;quot;#ff0000&amp;quot;&amp;gt;被同村的人用袋偷偷摘走&amp;lt;/font&amp;gt;（姓李的口述）。\&quot; style=\&quot;whiteSpace=wrap;html=1;fontSize=10;fontFamily=Verdana;align=left;rounded=1;shadow=0;labelBackgroundColor=none;strokeWidth=1;\&quot; parent=\&quot;77e6c97f196da883-2\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;10\&quot; y=\&quot;457\&quot; width=\&quot;120\&quot; height=\&quot;73\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;JQ_74pPJwf8eMKsfELcf-103\&quot; value=\&quot;&amp;lt;div&amp;gt;竺某是学校职工，经常罚刘振发不回家吃饭——&amp;amp;gt;身体长不好；&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;竺某他也没好好教姓刘的，就安排姓刘的坐西北方漏风的窗户边，尤其是冬天——&amp;amp;gt;身体长坏；&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;竺某&amp;lt;/span&amp;gt;安排&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;姓刘的&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;跟调皮的邹同学（他母亲姓田）一起坐——&amp;amp;gt;染上不良思想行为（偷豌豆、大脑里种下色情内容等）；&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;甚至打坏刘振发的脑袋（数学教师&amp;amp;lt;小学三年级&amp;amp;gt;、同学&amp;amp;lt;陈军、邹某&amp;amp;gt;都有参与）——&amp;amp;gt;终身立不起来。&amp;lt;/div&amp;gt;\&quot; style=\&quot;whiteSpace=wrap;html=1;fontSize=10;fontFamily=Verdana;align=left;rounded=1;shadow=0;labelBackgroundColor=none;strokeWidth=1;\&quot; parent=\&quot;77e6c97f196da883-2\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;190\&quot; y=\&quot;190\&quot; width=\&quot;300\&quot; height=\&quot;106.5\&quot; as=\&quot;geometry\&quot; /&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;JQ_74pPJwf8eMKsfELcf-104\&quot; value=\&quot;\&quot; style=\&quot;edgeStyle=orthogonalEdgeStyle;rounded=0;orthogonalLoop=1;jettySize=auto;html=1;strokeColor=#FF0000;\&quot; parent=\&quot;77e6c97f196da883-2\&quot; source=\&quot;JQ_74pPJwf8eMKsfELcf-97\&quot; target=\&quot;JQ_74pPJwf8eMKsfELcf-103\&quot; edge=\&quot;1\&quot;&gt;\n          &lt;mxGeometry relative=\&quot;1\&quot; as=\&quot;geometry\&quot;&gt;\n            &lt;Array as=\&quot;points\&quot;&gt;\n              &lt;mxPoint x=\&quot;150\&quot; y=\&quot;237\&quot; /&gt;\n              &lt;mxPoint x=\&quot;150\&quot; y=\&quot;237\&quot; /&gt;\n            &lt;/Array&gt;\n          &lt;/mxGeometry&gt;\n        &lt;/mxCell&gt;\n        &lt;mxCell id=\&quot;JQ_74pPJwf8eMKsfELcf-105\&quot; value=\&quot;刘振发的身体与大脑被损坏后，经常出现问题：&amp;lt;div&amp;gt;（1）是非观不坚定——没有打击同学考试抄袭、偷窥女厕所等。&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;（2）行为上的偏差：无论是玩耍、还是劳作等。&amp;lt;/span&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;（3）应激障碍：被别人打头的时候没有同时打别人的头。&amp;lt;span style=&amp;quot;background-color: initial;&amp;quot;&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;\&quot; style=\&quot;whiteSpace=wrap;html=1;fontSize=10;fontFamily=Verdana;align=left;rounded=1;shadow=0;labelBackgroundColor=none;strokeWidth=1;\&quot; parent=\&quot;77e6c97f196da883-2\&quot; vertex=\&quot;1\&quot;&gt;\n          &lt;mxGeometry x=\&quot;270\&quot; y=\&quot;405\&quot; width=\&quot;220\&quot; height=\&quot;95\&quot; as=\&quot
